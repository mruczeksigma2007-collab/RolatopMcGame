<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minecraft: Wioska</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--panel:#3a3a3a;--panel2:#555;--text:#f2f2f2;--muted:#b5b5b5;--green:#5fb83a;--red:#d23b3b;--gold:#f2c230;--dia:#4fe3d6}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:linear-gradient(#0002,#0002),repeating-conic-gradient(#4f9a2e 0 25%,#478c29 0 50%) 0 0/40px 40px;color:var(--text);font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-size:12px;line-height:1.7;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:560px}
.panel{background:var(--panel);border:4px solid #111;box-shadow:inset 4px 4px 0 #777,inset -4px -4px 0 #222;padding:16px;margin-bottom:14px}
h1{font-size:17px;margin:0;color:var(--gold);text-shadow:3px 3px 0 #000;line-height:1.4}
.sub{color:var(--muted);font-size:10px;margin:6px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dia{color:var(--dia);text-shadow:2px 2px 0 #000;font-size:14px;white-space:nowrap}
button{font:inherit;color:var(--text);cursor:pointer;border:4px solid #111;background:var(--panel2);box-shadow:inset 3px 3px 0 #888,inset -3px -3px 0 #333;padding:12px 14px;text-align:left;width:100%;margin:0 0 10px;min-height:48px}
button:hover:not(:disabled){background:#6a7a8a}
button:disabled{cursor:default}
button.ok{background:var(--green)}
button.bad{background:var(--red)}
button.sel{outline:4px solid var(--gold);outline-offset:-4px}
.go{text-align:center;color:#111;background:var(--green);box-shadow:inset 3px 3px 0 #9e6,inset -3px -3px 0 #263}
.go:hover:not(:disabled){background:#78d44f}
.village{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:8px 0 20px}
.hs{background:none;border:0;box-shadow:none;padding:0;margin:0;min-height:0;text-align:center;display:flex;flex-direction:column;align-items:center}
.hs:hover:not(:disabled){background:none;transform:translateY(-3px)}
.vil{font-size:34px;line-height:1;margin-bottom:-6px;z-index:2;filter:drop-shadow(2px 2px 0 #0008)}
.roof{width:100%;height:42px;background:var(--roof);clip-path:polygon(50% 0,100% 100%,0 100%);border-bottom:4px solid #111}
.body{width:84%;height:70px;border:4px solid #111;border-top:0;background:repeating-linear-gradient(#a67c47 0 10px,#8d6a38 10px 20px);position:relative}
.body::before,.body::after{content:"";position:absolute;top:14px;width:16px;height:16px;border:3px solid #111;background:#79b8e6}
.body::before{left:10px}.body::after{right:10px}
.door{position:absolute;left:50%;bottom:0;width:20px;height:34px;margin-left:-10px;background:#5a3a1c;border:3px solid #111;border-bottom:0}
.hs.done .body::before,.hs.done .body::after{background:var(--gold)}
.lbl{font-size:9px;margin-top:8px;color:#fff;text-shadow:2px 2px 0 #000}
.badge{font-size:9px;color:var(--dia);text-shadow:1px 1px 0 #000}
.bubble{background:#f2f2f2;color:#111;border:4px solid #111;padding:12px;margin:10px 0 14px;font-size:11px}
.vbig{font-size:46px}
.timer{height:14px;background:#111;border:3px solid #111;margin:10px 0}
.timer i{display:block;height:100%;width:100%;background:var(--green)}
.q{font-size:12px;margin:0 0 12px;min-height:50px}
.msg{min-height:40px;font-size:10px;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.cell{aspect-ratio:1;margin:0;padding:0;display:grid;place-items:center;font-size:34px;background:repeating-conic-gradient(#3d5a2a 0 25%,#34502 0 50%) 0 0/16px 16px;background:repeating-conic-gradient(#3f5f2c 0 25%,#355226 0 50%) 0 0/16px 16px;text-align:center}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pad{margin:0;height:84px;opacity:.55}
.pad.lit{opacity:1;filter:brightness(1.5)}
.big{font-size:28px;color:var(--dia);text-shadow:3px 3px 0 #000;text-align:center;margin:10px 0}
.hide{display:none}
#menu{position:fixed;inset:0;z-index:50;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(#4f9fe6,#bfe2fa 64%)}
#menu.hide{display:none}
#menu::before{content:"";position:absolute;top:10%;left:-120px;width:80px;height:24px;background:#fff;box-shadow:24px -16px 0 #fff,48px 0 0 #fff,160px 90px 0 #fff,184px 74px 0 #fff,208px 90px 0 #fff;opacity:.9;animation:drift 50s linear infinite}
@keyframes drift{to{transform:translateX(calc(100vw + 240px))}}
#menu::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-conic-gradient(#7a5230 0 25%,#6b4526 0 50%) 0 0/32px 32px;border-top:16px solid #5fb83a;z-index:0}
#menu>*{position:relative;z-index:1}
.logo{text-align:center;position:relative;margin-top:10px}
.l1{display:block;font-size:clamp(24px,8.6vw,48px);color:#c6c6c6;letter-spacing:2px;text-shadow:0 1px 0 #999,0 2px 0 #888,0 3px 0 #777,0 4px 0 #666,0 5px 0 #555,0 6px 0 #444,0 10px 8px #0006}
.l2{display:block;font-size:clamp(10px,3.2vw,16px);color:#e8e8e8;margin-top:14px;text-shadow:3px 3px 0 #000}
.splash{position:absolute;right:-6px;bottom:-34px;color:#ff0;font-size:11px;text-shadow:2px 2px 0 #3f3f00;transform:rotate(-16deg);white-space:nowrap;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:rotate(-16deg) scale(1.12)}}
.mbtns{width:min(92vw,360px);margin-top:20px}
.mb{text-align:center;color:#e0e0e0;text-shadow:2px 2px 0 #3a3a3a;background:#6f6f6f;box-shadow:inset 3px 3px 0 #a6a6a6,inset -3px -3px 0 #3d3d3d;border-color:#000}
.mb:hover:not(:disabled){background:#6f7f9f;color:#ffffa0}
.minfo{width:min(92vw,360px);background:#000b;border:3px solid #000;padding:12px;font-size:9px;color:#fff;line-height:1.9}
.mfoot{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding:0 14px;font-size:9px;color:#fff;text-shadow:2px 2px 0 #000;z-index:1}
</style>
</head>
<body>
<div id="menu">
<div class="logo"><span class="l1">MINECRAFT</span><span class="l2">WIOSKA EDITION</span><span class="splash" id="splash"></span></div>
<div class="mbtns">
<button class="mb" id="mplay">Graj</button>
<button class="mb" id="mhow">Jak grać?</button>
<button class="mb" id="mreset">Resetuj postęp</button>
<button class="mb" id="mquit">Wyjdź z gry</button>
</div>
<div class="minfo hide" id="minfo">Kliknij dom w wiosce i pomóż mieszkańcowi zadaniem. Za dobre odpowiedzi dostajesz 💎. Dwa diamenty u mieszkańca zapalają światło w jego domu!</div>
<div class="mfoot"><span>Wioska 1.0</span><span id="mtot"></span></div>
</div>
<div class="wrap hide">
<div class="panel top"><div><h1>WIOSKA</h1><p class="sub" id="hint">Kliknij dom i pomóż mieszkańcowi</p></div><div class="dia" id="total">💎0</div></div>
<div id="map" class="village"></div>
<div id="stage" class="hide"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

let S={best:[0,0,0,0,0]};
try{const s=JSON.parse(localStorage.getItem("mcvillage")||"null");if(s&&s.best)S=s}catch(e){}
const save=()=>{try{localStorage.setItem("mcvillage",JSON.stringify(S))}catch(e){}};
if(S.dia==null)S.dia=S.best.reduce((a,b)=>a+b,0);
S.lv=S.lv||[1,1,1,1,1];S.up=S.up||{time:0,bonus:0};S.best=S.lv.map(l=>l>1?2:0);

function farmQs(){
  const o=[];
  for(let n=0;n<3;n++){
    const a=rnd(2,5),b=rnd(3,9),c=rnd(1,8),ans=a*b+c,set=new Set([ans]);
    while(set.size<4)set.add(ans+rnd(-6,6)||ans+7);
    const op=shuffle([...set]).map(String);
    o.push([`Potrzebuję pszenicy: ${a} skrzynie po ${b} snopków i jeszcze ${c}. Ile snopków?`,op,op.indexOf(String(ans)),`${a}×${b}+${c} = ${ans}.`]);
  }
  return o;
}
const LIB=[
["Ciąg: 3, 6, 12, 24, … Co dalej?",["30","36","48","60"],2,"Za każdym razem ×2, więc 48."],
["Który z nich NIE pasuje: Zombie, Szkielet, Creeper, Osadnik?",["Zombie","Szkielet","Creeper","Osadnik"],3,"Osadnik nie jest wrogim mobem."],
["Którego moba boi się creeper?",["Wilka","Kota","Golema","Lisa"],1,"Creepery uciekają przed kotami."]];
const SMITH=[
["Kilof żelazny",["Sztabka żelaza","Patyk"]],
["Pochodnia",["Węgiel","Patyk"]],
["Łuk",["Patyk","Nić"]]];

const H=[
 {n:"Rolnik",v:"🧑‍🌾",roof:"#b5472f",say:"Witaj! Mam żniwa i gubię się w liczeniu. Pomożesz?",ok:"Dziękuję! Zboże policzone!",f:()=>quiz(farmQs(),15000)},
 {n:"Kowal",v:"🧑‍🏭",roof:"#6b6b6b",say:"Hej! Skończyły mi się narzędzia. Wybierz składniki do wyrobu!",ok:"Świetna robota, kowalu-pomocniku!",f:craft},
 {n:"Bibliotekarz",v:"🧑‍🏫",roof:"#3b6fd2",say:"Cii... Mam kilka zagadek. Rozwiążesz je?",ok:"Mądra głowa! Książki są wdzięczne.",f:()=>quiz(LIB,18000)},
 {n:"Strażnik",v:"🧑‍✈️",roof:"#4a4a8a",say:"Noc! Zombie atakują wioskę! Klikaj zombie, ale NIE osadników!",ok:"Wioska bezpieczna dzięki tobie!",f:zombie},
 {n:"Kapłan",v:"🧙",roof:"#8a3bb5",say:"Pokażę ci magiczną sekwencję. Powtórz ją bez błędu.",ok:"Magia zadziałała! Dziękuję.",f:mem}
];
const tot=()=>S.dia;

function drawMap(){
  $("total").textContent="💎"+tot();
  const helped=S.best.filter(x=>x>=2).length;
  $("hint").textContent=helped===H.length?"Cała wioska ci dziękuje! Jesteś bohaterem!":`Pomóż mieszkańcom: ${helped}/${H.length}`;
  $("map").classList.remove("hide");$("stage").classList.add("hide");
  $("map").innerHTML="";
  H.forEach((h,n)=>{
    const b=document.createElement("button");
    b.className="hs"+(S.best[n]>=2?" done":"");
    b.innerHTML=`<span class="vil">${h.v}</span><div class="roof" style="--roof:${h.roof}"></div><div class="body"><div class="door"></div></div><span class="lbl">${h.n}</span><span class="badge">${S.best[n]>=2?"✅ ":""}${"💎".repeat(S.best[n])}</span>`;
    b.onclick=()=>visit(n);
    $("map").appendChild(b);
  });
  const mb=document.createElement("button");
  mb.className="mb";mb.style.gridColumn="1 / -1";mb.textContent="← Menu główne";mb.onclick=showMenu;
  $("map").appendChild(mb);
}
function visit(n){
  window.cur=n;
  $("map").classList.add("hide");$("stage").classList.remove("hide");
  $("stage").innerHTML=`<div class="panel"><div class="vbig">${H[n].v}</div><div class="sub">${H[n].n}</div><div class="bubble">${H[n].say}</div><div id="area"><button class="go" id="st">▶ POMAGAM</button><button id="bk">← WRÓĆ DO WIOSKI</button></div></div>`;
  $("st").onclick=()=>{$("area").innerHTML="";H[n].f()};$("bk").onclick=drawMap;
}
function finish(got,max){
  const n=window.cur;
  if(got>S.best[n]){S.best[n]=got;save()}
  $("area").innerHTML=`<div class="big">💎 ${got}/${max}</div><div class="bubble">${got>=2?H[n].ok:"Hmm, nie do końca się udało. Spróbujemy jeszcze raz?"}</div><button class="go" id="r1">↻ JESZCZE RAZ</button><button id="r3">← WRÓĆ DO WIOSKI</button>`;
  $("r1").onclick=()=>visit(n);$("r3").onclick=drawMap;
}

function quiz(qs,time){
  let i=0,got=0,t0,raf,locked;
  const area=$("area");
  function ask(){
    if(i>=qs.length)return finish(got,qs.length);
    locked=false;
    const [q,o,c]=qs[i];
    const items=shuffle(o.map((t,k)=>({t,r:k===c})));
    area.innerHTML=`<div class="sub">Zadanie ${i+1}/${qs.length}  ·  💎${got}</div><div class="timer"><i id="bar"></i></div><p class="q">${q}</p><div id="opts"></div><p class="msg" id="msg"></p>`;
    items.forEach(it=>{const b=document.createElement("button");b.textContent=it.t;b.dataset.r=it.r?1:0;b.onclick=()=>pick(b,it.r);$("opts").appendChild(b)});
    t0=performance.now();tick();
  }
  function tick(){
    const l=Math.max(0,1-(performance.now()-t0)/time),bar=$("bar");
    if(!bar)return;
    bar.style.width=l*100+"%";bar.style.background=l>.5?"var(--green)":l>.25?"var(--gold)":"var(--red)";
    if(l<=0&&!locked)return pick(null,false,true);
    raf=requestAnimationFrame(tick);
  }
  function pick(b,r,to){
    if(locked)return;locked=true;cancelAnimationFrame(raf);
    [...$("opts").children].forEach(x=>{x.disabled=true;if(x.dataset.r==="1")x.classList.add("ok")});
    if(r)got++;else if(b)b.classList.add("bad");
    $("msg").textContent=(r?"Dobrze! +1 💎  ":to?"Czas minął!  ":"Pudło!  ")+qs[i][3];
    i++;setTimeout(ask,1400);
  }
  ask();
}

function craft(){
  const POOL=["Sztabka żelaza","Patyk","Węgiel","Nić","Diament","Deska"];
  let i=0,got=0,sel=new Set(),done=false;
  function render(){
    if(i>=SMITH.length)return finish(got,SMITH.length);
    sel=new Set();done=false;
    $("area").innerHTML=`<div class="sub">Zlecenie ${i+1}/${SMITH.length}  ·  💎${got}</div><p class="q">Zrób: ${SMITH[i][0]}. Wybierz 2 składniki.</p><div class="items" id="it"></div><button class="go" id="mk">🔨 WYKONAJ</button><p class="msg" id="msg"></p>`;
    POOL.forEach(p=>{const b=document.createElement("button");b.textContent=p;b.onclick=()=>{if(done)return;sel.has(p)?sel.delete(p):sel.add(p);b.classList.toggle("sel")};$("it").appendChild(b)});
    $("mk").onclick=()=>{
      if(done)return;
      if(sel.size!==2){$("msg").textContent="Wybierz dokładnie 2 składniki.";return}
      done=true;
      const need=SMITH[i][1],r=need.every(x=>sel.has(x));
      [...$("it").children].forEach(b=>{if(need.includes(b.textContent))b.classList.add("ok");else if(sel.has(b.textContent))b.classList.add("bad")});
      if(r)got++;
      $("msg").textContent=r?"Udało się! +1 💎":"Nie ten przepis. Potrzeba: "+need.join(" + ");
      i++;setTimeout(render,1700);
    };
  }
  render();
}

function zombie(){
  let score=0,left=20,cur=-1,type="",sid,tid;
  $("area").innerHTML=`<div class="sub">🧟 +1  ·  🧑 −2  ·  3 pkt = 1 💎</div><div class="top"><span id="sc">Punkty: 0</span><span id="tm">20s</span></div><div class="grid" id="gr"></div>`;
  for(let k=0;k<9;k++){const c=document.createElement("button");c.className="cell";c.onclick=()=>hit(k);$("gr").appendChild(c)}
  function show(){
    [...$("gr").children].forEach(c=>c.textContent="");
    cur=rnd(0,8);type=Math.random()<.72?"z":"v";
    $("gr").children[cur].textContent=type==="z"?"🧟":"🧑";
  }
  function hit(k){
    if(k!==cur)return;
    score=type==="z"?score+1:Math.max(0,score-2);
    $("sc").textContent="Punkty: "+score;$("gr").children[k].textContent="";cur=-1;
  }
  show();sid=setInterval(show,720);
  tid=setInterval(()=>{
    left--;$("tm").textContent=left+"s";
    if(left<=0){clearInterval(tid);clearInterval(sid);finish(Math.min(3,Math.floor(score/3)),3)}
  },1000);
}

function mem(){
  const cols=["#d23b3b","#3b6fd2","#5fb83a","#f2c230"];
  let seq=[],pos=0,round=0,busy=true,dead=false;
  $("area").innerHTML=`<div class="sub" id="st">Patrz uważnie...</div><div class="pads" id="pd"></div><p class="msg">Każda runda to 1 💎 (max 3).</p>`;
  cols.forEach((c,k)=>{const b=document.createElement("button");b.className="pad";b.style.background=c;b.onclick=()=>tap(k);$("pd").appendChild(b)});
  async function flash(k){const p=$("pd").children[k];p.classList.add("lit");await sleep(380);p.classList.remove("lit");await sleep(180)}
  async function next(){
    busy=true;seq.push(rnd(0,3));pos=0;
    $("st").textContent=`Runda ${round+1}  ·  patrz...`;
    await sleep(600);
    for(const k of seq){if(dead)return;await flash(k)}
    busy=false;$("st").textContent="Twoja kolej!";
  }
  async function tap(k){
    if(busy)return;
    busy=true;await flash(k);
    if(k!==seq[pos]){dead=true;$("st").textContent="Pudło!";await sleep(900);return finish(round,3)}
    pos++;busy=false;
    if(pos===seq.length){
      round++;
      if(round>=3){busy=true;$("st").textContent="Idealnie!";await sleep(800);return finish(3,3)}
      $("st").textContent="Dobrze! +1 💎";await sleep(600);next();
    }
  }
  next();
}
let rs=false;
const SPL=["Pomóż wiosce!","Zbieraj diamenty!","Uważaj na creepery!","Ssssss...","Nie kop w dół!","Osadnicy czekają!","Hmmm!","Zrobione z bloków!","Kocham kopać!"];
function showMenu(){
  $("splash").textContent=SPL[rnd(0,SPL.length-1)];
  $("mtot").textContent="💎 "+tot();
  $("minfo").classList.add("hide");
  rs=false;$("mreset").textContent="Resetuj postęp";
  $("menu").classList.remove("hide");
  document.querySelector(".wrap").classList.add("hide");
}
$("mplay").onclick=()=>{$("menu").classList.add("hide");document.querySelector(".wrap").classList.remove("hide");drawMap()};
$("mhow").onclick=()=>$("minfo").classList.toggle("hide");
$("mreset").onclick=()=>{
  if(!rs){rs=true;$("mreset").textContent="Na pewno? Kliknij znowu";return}
  S={best:[0,0,0,0,0],dia:0,lv:[1,1,1,1,1],up:{time:0,bonus:0}};save();rs=false;
  $("mreset").textContent="Postęp usunięty!";$("mtot").textContent="💎 0";
};
$("mquit").onclick=()=>{$("splash").textContent="Wioska cię potrzebuje!"};
/* ===== 3D WIOSKA ===== */
const V=document.createElement("div");
V.style.cssText="position:relative;width:100%;height:min(70vh,580px);min-height:400px;border:4px solid #111;overflow:hidden;touch-action:none;background:#8ec9f5;margin-bottom:10px;box-shadow:inset 0 0 0 3px #fff3";
V.innerHTML='<div style="position:absolute;left:8px;bottom:8px;z-index:2;font-size:9px;color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none">Przeciągnij: obrót · Kliknij dom: pomóż</div>';
let T3=null;
function init3D(){
  if(T3)return;
  if(!window.THREE){V.textContent="Nie udało się załadować grafiki 3D.";T3={};return}
  const SKY=0x8ec9f5;
  const scene=new THREE.Scene();scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,70,150);
  const cam=new THREE.PerspectiveCamera(50,1,.1,200);
  const ren=new THREE.WebGLRenderer({antialias:true});
  ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
  V.insertBefore(ren.domElement,V.firstChild);
  scene.add(new THREE.HemisphereLight(0xcfe9ff,0x5a7a3a,.75));
  const sun=new THREE.DirectionalLight(0xfff0d0,1.05);sun.position.set(16,24,10);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-28,right:28,top:28,bottom:-28,near:1,far:90});sun.shadow.bias=-.0006;scene.add(sun);

function craftL(L){
  const POOL=["Sztabka żelaza","Patyk","Węgiel","Nić","Diament","Deska","Kamień"];
  const rs=shuffle(SM.slice()).slice(0,Math.min(5,2+Math.ceil(L/2)));
  const T=Math.max(9,22-2*L)*1000*TM();
  let i=0,got=0,sel,done,t0,raf;
  function render(){
    cancelAnimationFrame(raf);
    if(i>=rs.length)return finish(got,rs.length);
    sel=new Set();done=false;
    $("area").innerHTML=`<div class="sub">Zlecenie ${i+1}/${rs.length}  ·  💎${got}</div><div class="timer"><i id="bar"></i></div><p class="q">Zrób: ${rs[i][0]}. Wybierz 2 składniki.</p><div class="items" id="it"></div><button class="go" id="mk">🔨 WYKONAJ</button><p class="msg" id="msg"></p>`;
    POOL.forEach(p=>{const b=document.createElement("button");b.textContent=p;b.onclick=()=>{if(done)return;sel.has(p)?sel.delete(p):sel.add(p);b.classList.toggle("sel")};$("it").appendChild(b)});
    $("mk").onclick=()=>check(false);
    t0=performance.now();tick();
  }
  function tick(){
    if(done)return;
    const l=Math.max(0,1-(performance.now()-t0)/T),bar=$("bar");
    if(!bar)return;
    bar.style.width=l*100+"%";bar.style.background=l>.5?"var(--green)":l>.25?"var(--gold)":"var(--red)";
    if(l<=0)return check(true);
    raf=requestAnimationFrame(tick);
  }
  function check(to){
    if(done)return;
    if(!to&&sel.size!==2){$("msg").textContent="Wybierz dokładnie 2 składniki.";return}
    done=true;cancelAnimationFrame(raf);
    const need=rs[i][1],r=!to&&need.every(x=>sel.has(x));
    [...$("it").children].forEach(b=>{if(need.includes(b.textContent))b.classList.add("ok");else if(sel.has(b.textContent))b.classList.add("bad")});
    if(r)got++;
    $("msg").textContent=r?"Udało się! +1 💎":(to?"Czas minął! ":"Nie ten przepis. ")+"Potrzeba: "+need.join(" + ");
    i++;setTimeout(render,1700);
  }
  render();
}

function zombieL(L){
  const MX=3+Math.floor((L-1)/2),pz=.72-.03*L,iv=Math.max(380,760-70*L);

  for(let k=0;k<9;k++){const c=document.createElement("button");c.className="cell";c.onclick=()=>hit(k);$("gr").appendChild(c)}
  function show(){
    [...$("gr").children].forEach(c=>c.textContent="");
    cur=rnd(0,8);type=Math.random()<pz+.1?"z":"v";
    $("gr").children[cur].textContent=type==="z"?"🧟":"🧑";

}

function memL(L){
  const cols=["#d23b3b","#3b6fd2","#5fb83a","#f2c230"],RN=Math.min(5,2+Math.ceil(L/2)),fd=Math.max(200,380-35*L);
  let seq=[],pos=0,round=0,busy=true,dead=false;
  $("area").innerHTML=`<div class="sub" id="ms">Patrz uważnie...</div><div class="pads" id="pd"></div><p class="msg">Każda runda to 1 💎 (max ${RN}).</p>`;
  cols.forEach((c,k)=>{const b=document.createElement("button");b.className="pad";b.style.background=c;b.onclick=()=>tap(k);$("pd").appendChild(b)});
  async function flash(k){const p=$("pd").children[k];p.classList.add("lit");await sleep(fd);p.classList.remove("lit");await sleep(Math.round(fd/2))}
  async function next(){
    busy=true;seq.push(rnd(0,3));pos=0;
    $("ms").textContent=`Runda ${round+1}/${RN}  ·  patrz...`;
    await sleep(600);
    for(const k of seq){if(dead)return;await flash(k)}
    busy=false;$("ms").textContent="Twoja kolej!";
  }
  async function tap(k){
    if(busy)return;
    busy=true;await flash(k);
    if(k!==seq[pos]){dead=true;$("ms").textContent="Pudło!";await sleep(900);return finish(round,RN)}
    pos++;busy=false;
    if(pos===seq.length){
      round++;
      if(round>=RN){busy=true;$("ms").textContent="Idealnie!";await sleep(800);return finish(RN,RN)}
      $("ms").textContent="Dobrze! +1 💎";await sleep(600);next();
    }
  }
  next();
}

  if(!d){d=document.createElement("div");d.id="dr";document.body.appendChild(d)}
  const h=HM()[k],f=FURN[s],cur=h.it[s],lv=h.lv||1,ref=cur>=0?Math.floor(f.it[cur][1]/2):0;
  d.innerHTML=`<div class="top"><b>🛒 ${f.n}</b><button id="dx" style="width:auto;margin:0;min-height:36px">✕</button></div><p class="sub">Sklep meblowy · masz 💎${S.dia}${cur>=0?` · zwrot za stary przedmiot: 💎${ref}`:""}</p>`+f.it.map((x,t)=>{
    const lock=lv<LVR[t],net=x[1]-ref,same=t===cur;
    return `<button class="di" data-t="${t}" ${lock||same||S.dia<net?"disabled":""}><span class="ic">${x[3]}</span><span><b>${x[0]}</b><br><small>+${x[2]}% czynszu</small></span><span>${same?"✅":lock?"🔒 Lv"+LVR[t]:"💎"+net}</span></button>`;
  }).join("")+(cur>=0?`<button id="rm">🗑 USUŃ (zwrot 💎${ref})</button>`:"");
  d.classList.add("on");
  $("dx").onclick=closeDr;
  d.querySelectorAll(".di").forEach(b=>b.onclick=()=>place(k,s,+b.dataset.t));
  if($("rm"))$("rm").onclick=()=>place(k,s,-1);
}
function place(k,s,t){
  const h=HM()[k],f=FURN[s],old=FM(h),cur=h.it[s];
  const ref=cur>=0?Math.floor(f.it[cur][1]/2):0,cost=t>=0?f.it[t][1]:0;
  if(S.dia+ref<cost)return;
  S.dia+=ref-cost;h.it[s]=t;
  if(h.rent)h.rent.pay=Math.max(1,Math.round(h.rent.pay*FM(h)/old));
  save();$("total").textContent="💎"+tot();
  note(t>=0?"🛠 Postawiono: "+f.it[t][0]:"🗑 Usunięto przedmiot");
  interior(k);
}

init3D=function(){
  if(t3state===2||t3state===3)return;

    try{

      throw new Error("init3D");

  }
  if(t3state===1)return;
  t3state=1;
  V.innerHTML='<div style="padding:20px;font-size:10px">Ładowanie grafiki 3D…</div>';

};

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ME(){
  if(S.earned==null)S.earned=S.dia||0;
  if(!S.nick)S.nick="Gracz"+rnd(100,999);
  S.av=S.av||"🧑‍🌾";
  S.inv=S.inv||{cases:{},pots:{}};S.inv.cases=S.inv.cases||{};S.inv.pots=S.inv.pots||{};
  S.pot=S.pot||{};S.bp=S.bp||{xp:0,cl:[]};
}
ME();
const POT={task:["🧪","Mikstura Zadań","×2 💎 za zadania"],rent:["🧫","Mikstura Czynszu","×2 💎 z wynajmu"],time:["⏳","Mikstura Czasu","+50% czasu w zadaniach"],xp:["⚡","Mikstura XP","×2 XP przepustki"],luck:["🍀","Mikstura Szczęścia","+2 💎 za zaliczone zadanie"],power:["🌟","Mikstura Potęgi","×2 💎 za zadania i z wynajmu"]};
const CASES={wood:{n:"Skrzynka drewniana",ic:"📦",c:15,k:1,w:{task:30,rent:30,xp:25,time:15}},iron:{n:"Skrzynka żelazna",ic:"🪙",c:40,k:1,w:{task:22,rent:22,xp:14,time:14,luck:18,power:10}},dia:{n:"Skrzynka diamentowa",ic:"💎",c:120,k:2,w:{task:15,rent:15,xp:10,time:10,luck:20,power:30}}};
const PDUR=600000;
function potOn(k){return ((S.pot&&S.pot[k])||0)>Date.now()}
function potMult(kind){let m=1;if(kind==="task"&&potOn("task"))m*=2;if(kind==="rent"&&potOn("rent"))m*=2;if(potOn("power"))m*=2;return Math.min(4,m)}
function addXP(n){ME();S.bp.xp+=Math.round(n*(potOn("xp")?2:1))}
function gain(n){ME();S.dia+=n;S.earned+=n;const t=$("total");if(t)t.textContent="💎"+S.dia}
const BPR=[[["dia",0,10]],[["case","wood",1]],[["dia",0,20]],[["pot","task",1]],[["case","iron",1]],[["dia",0,40]],[["pot","rent",1]],[["case","wood",2]],[["dia",0,60]],[["case","iron",1]],[["pot","power",1]],[["dia",0,100]],[["case","iron",2]],[["pot","xp",2]],[["case","dia",1],["dia",0,200]]];
const bpNeed=i=>80+20*i;
function bpTier(){ME();let x=S.bp.xp,t=0;while(t<15&&x>=bpNeed(t)){x-=bpNeed(t);t++}return [t,x,t<15?bpNeed(t):0]}
const rewTxt=r=>r.map(([t,k,n])=>t==="dia"?"💎"+n:t==="case"?CASES[k].ic+" "+CASES[k].n+(n>1?" ×"+n:""):POT[k][0]+" "+POT[k][1]+(n>1?" ×"+n:"")).join(" + ");
function giveRew(r){r.forEach(([t,k,n])=>{if(t==="dia")gain(n);else if(t==="case")S.inv.cases[k]=(S.inv.cases[k]||0)+n;else S.inv.pots[k]=(S.inv.pots[k]||0)+n})}

/* sieć: prawdziwa topka (db) */
let DB=null,UID=null,CANW=false,LB=[],lastPush=0;
async function initNet(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [user,db]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    let cw=null;try{cw=await user.can("data.write")}catch(e){}
    DB=db;UID=id;CANW=cw!==false;
    DB.collection("lb").orderBy("earned","desc").limit(50).onSnapshot(s=>{LB=s.docs.map(d=>({id:d.id,...d.data()}));if($("tbk"))topView()},e=>{});
    pushScore(true);
  }catch(e){}
}
function pushScore(force){
  if(!DB||!UID||!CANW)return;
  const now=Date.now();if(now-lastPush<(force?4000:15000))return;
  lastPush=now;ME();
  DB.collection("lb").doc(UID).set({nick:S.nick,av:S.av,earned:Math.round(S.earned),wallet:Math.round(S.dia),t:now}).catch(e=>{if(e&&e.code==="invalid_argument")CANW=false});
}
setInterval(()=>pushScore(false),20000);
initNet();

function stageShow(h){$("map").classList.add("hide");$("stage").classList.remove("hide");$("stage").innerHTML=h}
let topMode="earned";
function topView(){
  ME();
  const me=UID||"me";
  let rows=LB.filter(r=>r.id!==me);
  rows.push({id:me,nick:S.nick,av:S.av,earned:S.earned,wallet:S.dia});
  rows.sort((a,b)=>(b[topMode]||0)-(a[topMode]||0));rows=rows.slice(0,30);
  const st=!DB?"📴 Ranking online niedostępny w tym widoku — widzisz tylko siebie.":CANW?"✅ Twój wynik jest zapisywany w topce.":"👀 Masz dostęp tylko do podglądu — twój wynik nie trafi do topki (potrzebny dostęp Contributor).";
  stageShow(`<div class="panel"><h2 style="margin:0 0 8px;font-size:14px;color:var(--gold)">🏆 Topka diamentów</h2><p class="sub" style="margin:0 0 10px">${st}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px"><button data-tm="earned" class="${topMode==="earned"?"go":""}" style="text-align:center;font-size:9px">📈 Zdobyte</button><button data-tm="wallet" class="${topMode==="wallet"?"go":""}" style="text-align:center;font-size:9px">💰 Portfel</button></div>${rows.map((r,i)=>`<div class="bubble" style="margin:0 0 6px;padding:8px;display:flex;justify-content:space-between;gap:8px;${r.id===me?"background:#9be86a":""}"><span>${i+1}. ${esc(r.av||"🧑‍🌾")} ${esc(r.nick||"Gracz")}</span><b>💎${Math.round(r[topMode]||0)}</b></div>`).join("")}<button id="tbk" style="margin-top:8px">← WRÓĆ DO WIOSKI</button></div>`);
  $("stage").querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{topMode=b.dataset.tm;topView()});
  $("tbk").onclick=drawMap;
  pushScore(true);
}

let pTab="p";
function profile(t){
  if(t)pTab=t;ME();
  const [bt,bx,bn]=bpTier();
  const tabs=[["p","👤 Profil"],["b","🎖 Przepustka"],["i","🎒 Ekwipunek"]].map(([k,l])=>`<button data-pt="${k}" class="${pTab===k?"go":""}" style="text-align:center;padding:10px 4px;font-size:9px;margin:0">${l}</button>`).join("");
  let b=`<div class="panel"><div class="top"><b>${esc(S.av)} ${esc(S.nick)}</b><span class="dia">💎${S.dia}</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0">${tabs}</div>`;
  if(pTab==="p"){
    const done=S.lv.filter(l=>l>5).length,own=HM().filter(h=>h.own).length,rented=HM().filter(h=>h.rent).length;
    b+=`<div class="sub">Nick (widoczny w topce)</div><input id="nk" maxlength="14" value="${esc(S.nick)}" style="width:100%;font:inherit;background:#222;color:#fff;border:3px solid #000;padding:10px;margin:6px 0 8px"><button class="go" id="nks">ZAPISZ NICK</button><div class="sub">Avatar</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px">${["🧑‍🌾","🧙","🤴","👸","🦸","🧑‍🚀","🐷","🧟"].map(a=>`<button data-av="${a}" style="width:auto;margin:0;padding:6px 10px;min-height:40px;${a===S.av?"outline:3px solid #f2c230":""}">${a}</button>`).join("")}</div><div class="bubble">💎 Zdobyte łącznie: <b>${Math.round(S.earned)}</b><br>💰 Portfel: <b>${S.dia}</b><br>🏠 Domy: <b>${own}</b> (wynajęte: ${rented})<br>✅ Ukończone ścieżki: <b>${done}/5</b><br>🎖 Przepustka: <b>${bt}/15</b></div><button id="gt">🏆 TOPKA DIAMENTÓW</button>`;
  }else if(pTab==="b"){
    b+=`<div class="bubble">Poziom przepustki: <b>${bt}/15</b><br>${bt<15?"XP: "+bx+"/"+bn:"Przepustka ukończona!"}<div class="timer" style="margin:8px 0 4px"><i style="width:${bt<15?bx/bn*100:100}%;background:var(--gold)"></i></div><small>XP dostajesz za zadania, czynsz i otwieranie skrzynek.</small></div>`;
    BPR.forEach((r,i)=>{const cl=S.bp.cl.includes(i),can=bt>i&&!cl;b+=`<button ${can?'class="go" data-bc="'+i+'"':"disabled"} style="display:flex;justify-content:space-between;gap:8px;text-align:left;font-size:10px"><span>${i+1}. ${rewTxt(r)}</span><span>${cl?"✅":can?"🎁":"🔒"}</span></button>`});
  }else{
    b+=`<div class="sub">📦 Skrzynki (kupisz w sklepie)</div>`+Object.keys(CASES).map(k=>{const n=S.inv.cases[k]||0;return `<button data-oc="${k}" ${n?"":"disabled"} style="display:flex;justify-content:space-between;gap:8px"><span>${CASES[k].ic} ${CASES[k].n} ×${n}</span><span>${n?"OTWÓRZ":"—"}</span></button>`}).join("")+`<button id="gs">🛒 IDZ DO SKLEPU</button><div class="sub" style="margin:10px 0 6px">🧪 Mikstury (działają 10 min)</div>`+Object.keys(POT).map(k=>{const n=S.inv.pots[k]||0,on=potOn(k),s=on?Math.ceil((S.pot[k]-Date.now())/1000):0;return `<button data-up="${k}" ${n?"":"disabled"} style="display:flex;justify-content:space-between;gap:8px;font-size:10px"><span>${POT[k][0]} ${POT[k][1]} ×${n}<br><small>${POT[k][2]}${on?" · aktywna "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):""}</small></span><span>${n?"UŻYJ":"—"}</span></button>`}).join("");
  }
  b+=`<button id="pbk" style="margin-top:10px">← WRÓĆ DO WIOSKI</button></div>`;
  stageShow(b);
  const q=s=>$("stage").querySelectorAll(s);
  q("[data-pt]").forEach(x=>x.onclick=()=>profile(x.dataset.pt));
  q("[data-av]").forEach(x=>x.onclick=()=>{S.av=x.dataset.av;save();pushScore(true);profile()});
  if($("nks"))$("nks").onclick=()=>{const v=$("nk").value.replace(/[<>&"']/g,"").trim().slice(0,14);if(v){S.nick=v;save();pushScore(true);note("👤 Nick zapisany: "+v)}profile()};
  if($("gt"))$("gt").onclick=topView;
  q("[data-bc]").forEach(x=>x.onclick=()=>{const i=+x.dataset.bc;if(S.bp.cl.includes(i)||bpTier()[0]<=i)return;S.bp.cl.push(i);giveRew(BPR[i]);save();pushScore(false);note("🎁 "+rewTxt(BPR[i]));profile()});
  q("[data-oc]").forEach(x=>x.onclick=()=>openCase(x.dataset.oc));
  q("[data-up]").forEach(x=>x.onclick=()=>usePot(x.dataset.up));
  if($("gs"))$("gs").onclick=()=>shop();
  $("pbk").onclick=drawMap;
}
function usePot(k){
  if(!(S.inv.pots[k]>0))return;
  S.inv.pots[k]--;S.pot[k]=Math.max(Date.now(),S.pot[k]||0)+PDUR;save();
  note(POT[k][0]+" "+POT[k][1]+" aktywna: 10 min!");profile();
}
function openCase(k){
  if(!(S.inv.cases[k]>0))return;
  S.inv.cases[k]--;
  const C=CASES[k],got=[];
  for(let i=0;i<C.k;i++){
    const tot=Object.values(C.w).reduce((a,b)=>a+b,0);let r=Math.random()*tot,pick="task";
    for(const p in C.w){r-=C.w[p];if(r<=0){pick=p;break}}
    got.push(pick);
  }
  got.forEach(p=>S.inv.pots[p]=(S.inv.pots[p]||0)+1);
  addXP(15);save();
  let o=$("cs");
  if(!o){o=document.createElement("div");o.id="cs";o.style.cssText="position:fixed;inset:0;z-index:90;background:#000d;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center";document.body.appendChild(o)}
  o.style.display="flex";
  o.innerHTML=`<div class="panel" style="max-width:360px;width:100%"><div class="sub">Otwieranie: ${C.n}</div><div class="vbig" id="csi">${C.ic}</div><p id="cst" class="msg"></p></div>`;
  const ks=Object.keys(POT);let n=0;
  const iv=setInterval(()=>{const e=$("csi");if(e)e.textContent=POT[ks[n++%ks.length]][0]},90);
  setTimeout(()=>{
    clearInterval(iv);
    $("csi").textContent=got.map(p=>POT[p][0]).join(" ");
    $("cst").innerHTML=`🎉 Wylosowano:<br>${got.map(p=>`<b>${POT[p][1]}</b><br><small>${POT[p][2]} · 10 min</small>`).join("<br>")}<br><br><button class="go" id="cso">OK</button>`;
    $("cso").onclick=()=>{o.style.display="none";profile("i")};
  },1500);
}

finish=function(got,max){
  ME();
  const n=window.cur,pass=got>=Math.ceil(max*.6);
  const base=got+(pass?S.up.bonus+(potOn("luck")?2:0):0),mult=potMult("task"),earn=Math.round(base*mult);
  gain(earn);addXP(20+got*5+(pass?30:0));
  let msg;
  if(pass&&S.lv[n]<=5){S.lv[n]++;msg=S.lv[n]>5?"🎉 Ukończyłeś całą ścieżkę pomocy: "+H[n].n+"!":"⬆ Poziom "+S.lv[n]+" odblokowany: "+LVN[n][S.lv[n]-1]+"!"}
  else msg=pass?H[n].ok:"Hmm, nie do końca się udało. Potrzeba "+Math.ceil(max*.6)+" 💎 z "+max+". Spróbujemy jeszcze raz?";
  S.best=S.lv.map(l=>l>1?2:0);save();pushScore(false);
  $("area").innerHTML=`<div class="big">💎 +${earn}${mult>1?" (×"+mult+")":""}</div><p class="sub" style="margin:0 0 8px">${got}/${max}${pass&&S.up.bonus?" + "+S.up.bonus+" bonus":""} · razem: 💎${S.dia}</p><div class="bubble">${msg}</div><button class="go" id="r1">${pass?"▶ DALEJ":"↻ JESZCZE RAZ"}</button><button id="r2">🛒 SKLEP</button><button id="r3">← WRÓĆ DO WIOSKI</button>`;
  $("r1").onclick=()=>visit(n);$("r2").onclick=shop;$("r3").onclick=drawMap;
};

/* ===== PRZEPUSTKA: dwa tory + linia postępu ===== */
document.head.insertAdjacentHTML("beforeend","<style>.bpi{width:70px;min-height:82px;margin:0 auto 6px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;font-size:26px;line-height:1.1}.bpi small{font-size:8px;color:#fff;line-height:1.3}.bpi.can{background:#f2c230;color:#111;animation:bpp 1s ease-in-out infinite}.bpi.can small{color:#111}.bpi.done{opacity:.5}.bpi.lock{opacity:.4}@keyframes bpp{50%{filter:brightness(1.35)}}</style>");
const BPP=[[["dia",0,20]],[["case","iron",1]],[["pot","luck",1]],[["dia",0,40]],[["case","wood",2]],[["pot","power",1]],[["dia",0,60]],[["case","iron",2]],[["pot","task",2]],[["dia",0,100]],[["case","dia",1]],[["pot","rent",2]],[["dia",0,150]],[["case","dia",1]],[["dia",0,300],["pot","power",2]]];
function bpRender(){
  const [bt,bx,bn]=bpTier();
  S.bp.clp=S.bp.clp||[];
  const prem=!!S.bp.prem;
  const cell=(r,i,tr)=>{
    const done=(tr==="p"?S.bp.clp:S.bp.cl).includes(i),can=bt>i&&(tr==="f"||prem)&&!done;
    const mark=done?"✅":can?"":(tr==="p"&&!prem?"👑":"🔒");
    return `<button class="bpi ${done?"done":can?"can":"lock"}" ${can?`data-bc="${i}" data-tr="${tr}"`:"disabled"}><div style="display:flex;gap:4px;justify-content:center">${r.map(([t,k,n])=>`<span style="display:flex;flex-direction:column;align-items:center">${t==="dia"?"💎":t==="case"?CASES[k].ic:POT[k][0]}<small>×${n}</small></span>`).join("")}</div>${mark?`<small>${mark}</small>`:""}</button>`;
  };
  const mid=i=>{
    const f=bt>i?100:(bt===i&&bn?bx/bn*100:0);
    return `<div style="position:relative;height:34px"><div style="position:absolute;left:0;right:0;top:15px;height:4px;background:#555"></div><div style="position:absolute;left:0;top:15px;height:4px;width:${f}%;background:#f2c230"></div><div style="position:absolute;left:50%;top:2px;transform:translateX(-50%);width:30px;height:30px;border:3px solid #000;display:grid;place-items:center;font-size:10px;background:${bt>i?"#f2c230":"#777"};color:#111">${i+1}</div></div>`;
  };
  let h=`<div class="bubble">Poziom przepustki: <b>${bt}/15</b> · ${bt<15?"XP "+bx+"/"+bn:"ukończona!"}<br><small>👑 góra: premium · 🆓 dół: darmowa · XP za zadania, czynsz i skrzynki</small></div>`;
  if(!prem)h+=`<button class="go" id="bpp" ${S.dia<150?"disabled":""}>👑 ODBLOKUJ PREMIUM ZA 💎150</button>`;
  h+=`<div id="bps" style="overflow-x:auto;padding-bottom:8px;margin:0 -4px 10px"><div style="display:flex;width:max-content">${BPR.map((r,i)=>`<div style="width:80px;flex:none;text-align:center">${cell(BPP[i],i,"p")}${mid(i)}${cell(r,i,"f")}</div>`).join("")}</div></div>`;
  const p=$("stage").firstElementChild;
  [...p.children].slice(2,-1).forEach(e=>e.remove());
  $("pbk").insertAdjacentHTML("beforebegin",h);
  $("stage").querySelectorAll("[data-bc]").forEach(x=>x.onclick=()=>{
    const i=+x.dataset.bc,tr=x.dataset.tr,arr=tr==="p"?S.bp.clp:S.bp.cl,R=(tr==="p"?BPP:BPR)[i];
    if(arr.includes(i)||bpTier()[0]<=i||(tr==="p"&&!S.bp.prem))return;
    arr.push(i);giveRew(R);save();pushScore(false);note("🎁 "+rewTxt(R));profile();
  });
  if($("bpp"))$("bpp").onclick=()=>{if(S.dia>=150){S.dia-=150;S.bp.prem=1;save();note("👑 Premium odblokowane!");profile()}};
  const sc=$("bps");if(sc)sc.scrollLeft=Math.max(0,(bt-1)*80);
}
const _pf=profile;
profile=function(t){_pf(t);if(pTab==="b")bpRender()};
/* ===== NAPRAWA TOPKI (pętla odświeżania) ===== */
topView=function(){
  ME();
  const me=UID||"me";
  let rows=LB.filter(r=>r.id!==me);
  rows.push({id:me,nick:S.nick,av:S.av,earned:S.earned,wallet:S.dia});
  rows.sort((a,b)=>(b[topMode]||0)-(a[topMode]||0));rows=rows.slice(0,30);
  const st=!DB?"📴 Ranking online niedostępny w tym widoku — widzisz tylko siebie.":CANW?"✅ Twój wynik jest zapisywany w topce.":"👀 Masz dostęp tylko do podglądu — twój wynik nie trafi do topki (potrzebny dostęp Contributor).";
  stageShow(`<div class="panel"><button id="tbk2">← WRÓĆ DO WIOSKI</button><h2 style="margin:0 0 8px;font-size:14px;color:var(--gold)">🏆 Topka diamentów</h2><p class="sub" style="margin:0 0 10px">${st}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px"><button data-tm="earned" class="${topMode==="earned"?"go":""}" style="text-align:center;font-size:9px;margin:0">📈 Zdobyte</button><button data-tm="wallet" class="${topMode==="wallet"?"go":""}" style="text-align:center;font-size:9px;margin:0">💰 Portfel</button></div>${rows.map((r,i)=>`<div class="bubble" style="margin:0 0 6px;padding:8px;display:flex;justify-content:space-between;gap:8px;${r.id===me?"background:#9be86a":""}"><span>${i+1}. ${esc(r.av||"🧑‍🌾")} ${esc(r.nick||"Gracz")}</span><b>💎${Math.round(r[topMode]||0)}</b></div>`).join("")}<button id="tbk" style="margin-top:8px">← WRÓĆ DO WIOSKI</button></div>`);
  $("stage").querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{topMode=b.dataset.tm;topView()});
  $("tbk").onclick=drawMap;$("tbk2").onclick=drawMap;
};
topBtn.onclick=()=>topView();

/* ===== PRZEPUSTKA: NORMALNY (za darmo) + PLUS (10 000 💎) ===== */
let bpSel="n";
const BPB=[[["pot","time",1]],[["dia",0,15]],[["case","wood",1]],[["pot","luck",1]],[["dia",0,30]],[["case","wood",1]],[["pot","xp",1]],[["dia",0,50]],[["case","iron",1]],[["pot","task",1]],[["dia",0,80]],[["case","wood",2]],[["pot","rent",1]],[["dia",0,120]],[["case","iron",2]]];
const BPC=[[["dia",0,300]],[["case","iron",2]],[["pot","power",1]],[["dia",0,500]],[["case","dia",1]],[["pot","task",2]],[["dia",0,800]],[["case","dia",1]],[["pot","rent",2]],[["dia",0,1200]],[["case","dia",2]],[["pot","power",2]],[["dia",0,2000]],[["case","dia",2]],[["dia",0,3000]]];
const BPD=[[["pot","xp",2]],[["dia",0,200]],[["case","iron",2]],[["pot","luck",2]],[["dia",0,400]],[["case","dia",1]],[["pot","time",2]],[["dia",0,600]],[["case","dia",1]],[["pot","power",1]],[["dia",0,1000]],[["case","dia",2]],[["pot","task",3]],[["dia",0,1500]],[["dia",0,2000],["case","dia",3]]];
const PASS={n:{t:BPR,b:BPB,ct:"cl",cb:"cb"},p:{t:BPC,b:BPD,ct:"c3",cb:"c4"}};
const PLUSC=10000;
bpRender=function(){
  const [bt,bx,bn]=bpTier();
  ["cl","cb","c3","c4"].forEach(k=>S.bp[k]=S.bp[k]||[]);
  const P=PASS[bpSel],own=bpSel==="n"||!!S.bp.plus;
  const cell=(r,i,key)=>{
    const done=S.bp[key].includes(i),can=bt>i&&own&&!done;
    const mark=done?"✅":can?"":(!own?"👑":"🔒");
    return `<button class="bpi ${done?"done":can?"can":"lock"}" ${can?`data-bc="${i}" data-k="${key}"`:"disabled"}><div style="display:flex;gap:4px;justify-content:center">${r.map(([t,k,n])=>`<span style="display:flex;flex-direction:column;align-items:center">${t==="dia"?"💎":t==="case"?CASES[k].ic:POT[k][0]}<small>×${n}</small></span>`).join("")}</div>${mark?`<small>${mark}</small>`:""}</button>`;
  };
  const mid=i=>{
    const f=bt>i?100:(bt===i&&bn?bx/bn*100:0);
    return `<div style="position:relative;height:34px"><div style="position:absolute;left:0;right:0;top:15px;height:4px;background:#555"></div><div style="position:absolute;left:0;top:15px;height:4px;width:${f}%;background:#f2c230"></div><div style="position:absolute;left:50%;top:2px;transform:translateX(-50%);width:30px;height:30px;border:3px solid #000;display:grid;place-items:center;font-size:10px;background:${bt>i?"#f2c230":"#777"};color:#111">${i+1}</div></div>`;
  };
  let h=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px"><button data-bs="n" class="${bpSel==="n"?"go":""}" style="text-align:center;font-size:9px;margin:0">🎖 NORMALNY<br>za darmo</button><button data-bs="p" class="${bpSel==="p"?"go":""}" style="text-align:center;font-size:9px;margin:0">👑 PLUS<br>${S.bp.plus?"odblokowany":"💎10 000"}</button></div>`;
  h+=`<div class="bubble">Poziom: <b>${bt}/15</b> · ${bt<15?"XP "+bx+"/"+bn:"ukończona!"}<br><small>XP za zadania, czynsz i skrzynki. Poziom jest wspólny dla obu przepustek.</small></div>`;
  if(bpSel==="p"&&!S.bp.plus)h+=`<button class="go" id="bpp" ${S.dia<PLUSC?"disabled":""}>👑 KUP BATTLE PASS PLUS ZA 💎10 000</button>`;
  h+=`<div id="bps" style="overflow-x:auto;padding-bottom:8px;margin:0 -4px 10px"><div style="display:flex;width:max-content">${P.t.map((r,i)=>`<div style="width:80px;flex:none;text-align:center">${cell(r,i,P.ct)}${mid(i)}${cell(P.b[i],i,P.cb)}</div>`).join("")}</div></div>`;
  const p=$("stage").firstElementChild;
  [...p.children].slice(2,-1).forEach(e=>e.remove());
  $("pbk").insertAdjacentHTML("beforebegin",h);
  const q=s=>$("stage").querySelectorAll(s);
  q("[data-bs]").forEach(x=>x.onclick=()=>{bpSel=x.dataset.bs;profile()});
  q("[data-bc]").forEach(x=>x.onclick=()=>{
    const i=+x.dataset.bc,key=x.dataset.k,R=(key===P.ct?P.t:P.b)[i];
    if(S.bp[key].includes(i)||bpTier()[0]<=i||(bpSel==="p"&&!S.bp.plus))return;
    S.bp[key].push(i);giveRew(R);save();pushScore(false);note("🎁 "+rewTxt(R));profile();
  });
  if($("bpp"))$("bpp").onclick=()=>{if(S.dia>=PLUSC){S.dia-=PLUSC;S.bp.plus=1;save();note("👑 Battle Pass Plus odblokowany!");profile()}};
  const sc=$("bps");if(sc)sc.scrollLeft=Math.max(0,(bt-1)*80);
};

/* ===== EKWIPUNEK: SKRZYNKI | Potki ===== */
let invSel="";
function invRender(){
  ME();
  const cell=(ic,n,key,sub)=>`<div style="text-align:center"><button data-is="${key}" style="width:62px;min-height:62px;margin:0 auto 2px;padding:4px;font-size:28px;text-align:center;${n?"":"opacity:.4;"}${invSel===key?"outline:3px solid #f2c230;":""}">${ic}</button><div style="font-size:9px">${n}x${sub||""}</div></div>`;
  const cs=Object.keys(CASES).map(k=>cell(CASES[k].ic,S.inv.cases[k]||0,"c:"+k)).join("");
  const ps=Object.keys(POT).map(k=>{const on=potOn(k),s=on?Math.ceil((S.pot[k]-Date.now())/1000):0;return cell(POT[k][0],S.inv.pots[k]||0,"p:"+k,on?"<br>"+Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):"")}).join("");
  let det="";
  if(invSel){
    const [t,k]=invSel.split(":"),isC=t==="c",n=isC?(S.inv.cases[k]||0):(S.inv.pots[k]||0);
    det=`<div class="bubble" style="margin-top:12px"><b>${isC?CASES[k].ic+" "+CASES[k].n:POT[k][0]+" "+POT[k][1]}</b> · masz: ${n}x<br><small>${isC?(CASES[k].k>1?"2 potki":"1 potka")+" na 10 min · możliwe: "+Object.keys(CASES[k].w).map(p=>POT[p][0]).join(" "):POT[k][2]+" · działa 10 min"}</small></div><button class="go" id="ia" ${n?"":"disabled"}>${isC?"OTWÓRZ":"UŻYJ"}</button>`;
  }
  const h=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><div class="sub" style="margin-bottom:8px;color:var(--gold)">SKRZYNKI</div><div style="display:flex;flex-wrap:wrap;gap:8px">${cs}</div></div><div><div class="sub" style="margin-bottom:8px;color:var(--gold)">Potki</div><div style="display:flex;flex-wrap:wrap;gap:8px">${ps}</div></div></div>${det}<button id="gs2" style="margin-top:10px">🛒 IDZ DO SKLEPU (kup skrzynki)</button>`;
  const p=$("stage").firstElementChild;
  [...p.children].slice(2,-1).forEach(e=>e.remove());
  $("pbk").insertAdjacentHTML("beforebegin",h);
  $("stage").querySelectorAll("[data-is]").forEach(x=>x.onclick=()=>{invSel=x.dataset.is;invRender()});
  if($("ia"))$("ia").onclick=()=>{const [t,k]=invSel.split(":");if(t==="c")openCase(k);else usePot(k)};
  $("gs2").onclick=()=>shop();
}
const _pf3=profile;
profile=function(t){_pf3(t);if(pTab==="i")invRender()};
/* ===== OFFLINE: czynsz tylko 10% stawki ===== */
const OFFRATE=.1,OFFMAX=24;
function settleOffline(from){
  const now=Date.now();
  if(!(now-from>15000))return;
  let g=0,any=false;
  HM().forEach(h=>{
    const r=h.rent;if(!h.own||!r)return;
    const p=Math.min(OFFMAX,Math.floor((now-r.last)/(r.sec*1000)));
    if(p>0){g+=Math.max(1,Math.round(p*r.pay*OFFRATE));any=true}
    r.last=now;
  });
  S.seen=now;
  if(g>0){gain(g);save();note("😴 Nie było cię: czynsz offline to tylko "+Math.round(OFFRATE*100)+"% stawki: +"+g+" 💎")}
  else if(any)save();
}
if(S.seen)settleOffline(S.seen);
S.seen=Date.now();
setInterval(()=>{if(!document.hidden)S.seen=Date.now()},1000);
setInterval(()=>{if(!document.hidden)save()},5000);
document.addEventListener("visibilitychange",()=>{if(document.hidden){S.seen=Date.now();save()}else settleOffline(S.seen||Date.now())});

/* ===== EKWIPUNEK: przyciski SKRZYNKI / Potki ===== */
let invTab="c";
invRender=function(){
  ME();
  const cell=(ic,n,key,sub)=>`<div style="text-align:center"><button data-is="${key}" style="width:66px;min-height:66px;margin:0 auto 2px;padding:4px;font-size:30px;text-align:center;${n?"":"opacity:.4;"}${invSel===key?"outline:3px solid #f2c230;":""}">${ic}</button><div style="font-size:10px">${n}x${sub||""}</div></div>`;
  const items=invTab==="c"
    ?Object.keys(CASES).map(k=>cell(CASES[k].ic,S.inv.cases[k]||0,"c:"+k)).join("")
    :Object.keys(POT).map(k=>{const on=potOn(k),s=on?Math.ceil((S.pot[k]-Date.now())/1000):0;return cell(POT[k][0],S.inv.pots[k]||0,"p:"+k,on?"<br>"+Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):"")}).join("");
  let det="";
  if(invSel&&invSel[0]===invTab){
    const [t,k]=invSel.split(":"),isC=t==="c",n=isC?(S.inv.cases[k]||0):(S.inv.pots[k]||0);
    det=`<div class="bubble" style="margin-top:12px"><b>${isC?CASES[k].ic+" "+CASES[k].n:POT[k][0]+" "+POT[k][1]}</b> · masz: ${n}x<br><small>${isC?(CASES[k].k>1?"2 potki":"1 potka")+" na 10 min · możliwe: "+Object.keys(CASES[k].w).map(p=>POT[p][0]).join(" "):POT[k][2]+" · działa 10 min"}</small></div><button class="go" id="ia" ${n?"":"disabled"}>${isC?"OTWÓRZ":"UŻYJ"}</button>`;
  }
  const h=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px"><button data-it="c" class="${invTab==="c"?"go":""}" style="text-align:center;margin:0;font-size:10px">📦 SKRZYNKI</button><button data-it="p" class="${invTab==="p"?"go":""}" style="text-align:center;margin:0;font-size:10px">🧪 Potki</button></div><div style="display:flex;flex-wrap:wrap;gap:12px">${items}</div>${det}<button id="gs2" style="margin-top:12px">🛒 IDZ DO SKLEPU (kup skrzynki)</button>`;
  const p=$("stage").firstElementChild;
  [...p.children].slice(2,-1).forEach(e=>e.remove());
  $("pbk").insertAdjacentHTML("beforebegin",h);
  $("stage").querySelectorAll("[data-it]").forEach(x=>x.onclick=()=>{invTab=x.dataset.it;invSel="";invRender()});
  $("stage").querySelectorAll("[data-is]").forEach(x=>x.onclick=()=>{invSel=x.dataset.is;invRender()});
  if($("ia"))$("ia").onclick=()=>{const [t,k]=invSel.split(":");if(t==="c")openCase(k);else usePot(k)};
  $("gs2").onclick=()=>shop();
};
showMenu();
